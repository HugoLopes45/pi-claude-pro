name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate release plan
        id: plan
        run: node scripts/release.ts check "$BASE_SHA" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.before }}
      - run: npm ci
        if: steps.plan.outputs.changed == 'true'
      - run: npm run check
        if: steps.plan.outputs.changed == 'true'
      - name: Check existing publication
        if: steps.plan.outputs.changed == 'true'
        id: publication
        run: |
          node scripts/release.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          if target=$(git rev-parse --verify -q "refs/tags/v$VERSION^{commit}"); then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Tag v$VERSION points to a different commit." >&2
              exit 1
            fi
          fi
          name=$(node -p 'require("./package.json").name')
          published=$(node scripts/release.ts published "$name" "$VERSION" "$GITHUB_SHA")
          released=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft == false) | .id")
          {
            echo "published=$published"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
      - name: Publish to npm
        if: steps.plan.outputs.changed == 'true' && steps.publication.outputs.published == 'false'
        run: npm publish
      - name: Create the GitHub release
        if: steps.plan.outputs.changed == 'true' && steps.publication.outputs.released == ''
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
