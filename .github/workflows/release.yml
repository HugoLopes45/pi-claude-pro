name: Publish release
run-name: Publish ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read # read CI runs of the release commit
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a tested main commit
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z, got $TAG." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" | jq --slurp --raw-output '[.[].workflow_runs[]] | max_by(.run_number) | .conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "The latest CI run for $GITHUB_SHA on main must succeed before publication." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - name: Publish to npm
        run: |
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish
        env:
          TAG: ${{ github.event.release.tag_name }}
