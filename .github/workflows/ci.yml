name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PI_PACKAGES: >-
    @earendil-works/chord @earendil-works/pi-agent-core @earendil-works/pi-ai @earendil-works/pi-codemode
    @earendil-works/pi-coding-agent @earendil-works/pi-mcp @earendil-works/pi-telemetry @earendil-works/pi-tui

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pi requires Node 22.19 or later.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Pi's packages depend on each other with caret ranges, so each one is pinned to match a real install.
      - name: Check oldest supported Pi
        if: matrix.node == 24
        run: |
          read -ra packages <<< "$PI_PACKAGES"
          npm install --ignore-scripts --no-save --package-lock=false "${packages[@]/%/@1.0.3}"
          npm run check
      - name: Check latest Pi
        if: matrix.node == 24
        run: |
          read -ra packages <<< "$PI_PACKAGES"
          npm install --ignore-scripts --no-save --package-lock=false "${packages[@]/%/@latest}"
          npm run check

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Repository settings allow only GitHub-owned actions, so zizmor runs from PyPI.
      - run: pipx run zizmor==1.32.0 --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}
